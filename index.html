<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="擲骰子決定今天或一整週的早餐，結果一鍵複製成圖片貼 LINE。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='12' fill='%23fff' stroke='%231F1C18' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='8' fill='%23CF2F1B'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>早餐骰子</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* 版型：早餐店點單——上方紅字招牌＋骰子，中間是一張可撕的週點單，下方是菜單板 */
:root {
  --paper: #F7F5EF;
  --card: #FFFFFF;
  --ink: #1F1C18;
  --ink-2: #3D3832;
  --line: #E3DDD0;
  --red: #CF2F1B;
  --red-soft: #FBE4DF;
  --yolk: #F4B400;
  --yolk-soft: #FFF2C6;
  --shadow: 0 1px 0 rgba(60, 40, 20, .06), 0 8px 24px -12px rgba(60, 40, 20, .25);
  --f-display: 'Huninn', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  --f-body: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #181614; --card: #24211D; --ink: #F4EFE6; --ink-2: #D6CEC1; --line: #3A352E;
    --red: #FF6B53; --red-soft: #3F241F; --yolk: #FFC933; --yolk-soft: #3A3120;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 10px 28px -14px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #181614; --card: #24211D; --ink: #F4EFE6; --ink-2: #D6CEC1; --line: #3A352E;
  --red: #FF6B53; --red-soft: #3F241F; --yolk: #FFC933; --yolk-soft: #3A3120;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 10px 28px -14px rgba(0, 0, 0, .7);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--yolk); outline-offset: 2px; }

.wrap {
  max-width: 680px; margin: 0 auto;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px;
}

/* 招牌 */
.sign { display: flex; align-items: center; gap: 16px; justify-content: space-between; }
.sign h1 { font-family: var(--f-display); color: var(--red); font-size: clamp(40px, 11vw, 60px); line-height: 1; margin: 0; letter-spacing: .04em; font-weight: 400; }
.sign p { margin: 8px 0 0; color: var(--ink-2); font-size: 15px; }
.dice-btn { flex: none; border: 0; background: none; padding: 10px; perspective: 400px; border-radius: 16px; }
.cube { width: 68px; height: 68px; position: relative; transform-style: preserve-3d; transition: transform .95s cubic-bezier(.2, .7, .25, 1.15); transform: rotateX(-20deg) rotateY(25deg); }
.face { position: absolute; inset: 0; background: var(--card); border: 2px solid var(--ink); border-radius: 14px; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 9px; }
.face i { width: 11px; height: 11px; border-radius: 50%; background: var(--ink); align-self: center; justify-self: center; visibility: hidden; }
.face i.on { visibility: visible; }
.face.f1 i.on { background: var(--red); width: 16px; height: 16px; }
.f1 { transform: translateZ(34px); } .f6 { transform: rotateY(180deg) translateZ(34px); }
.f2 { transform: rotateY(90deg) translateZ(34px); } .f5 { transform: rotateY(-90deg) translateZ(34px); }
.f3 { transform: rotateX(90deg) translateZ(34px); } .f4 { transform: rotateX(-90deg) translateZ(34px); }

/* 控制列 */
.controls { display: flex; flex-direction: column; gap: 10px; }
.seg { display: inline-flex; background: var(--card); border: 1.5px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 8px 18px; border-radius: 999px; font-weight: 500; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.seg.big { align-self: flex-start; }
.seg.big button { padding: 10px 26px; font-size: 17px; font-weight: 700; }
.opts { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.opts .seg button { padding: 6px 14px; font-size: 14px; }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink-2); padding: 6px 4px; }
.chk input { width: 18px; height: 18px; accent-color: var(--red); }

.roll-main {
  border: 0; background: var(--red); color: #fff; font-family: var(--f-display); font-size: 26px; letter-spacing: .12em;
  padding: 14px 20px; border-radius: 16px; box-shadow: 0 4px 0 color-mix(in srgb, var(--red) 60%, #000);
  transition: transform .08s, box-shadow .08s;
}
.roll-main:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--red) 60%, #000); }
.roll-main small { display: block; font-family: var(--f-body); font-size: 13px; letter-spacing: 0; opacity: .9; margin-top: 2px; }

/* 點單 */
.slip { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
.slip-head { background: var(--yolk); color: #1F1C18; padding: 14px 18px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.slip-head b { font-family: var(--f-display); font-size: 24px; font-weight: 400; letter-spacing: .06em; }
.slip-head span { font-size: 14px; font-weight: 500; }
.rows { list-style: none; margin: 0; padding: 4px 0; }
.row { display: grid; grid-template-columns: 46px 64px minmax(0, 1fr) auto auto; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1.5px dashed var(--line); }
.row:last-child { border-bottom: 0; }
.row.is-today { background: var(--yolk-soft); }
.day { text-align: center; line-height: 1.15; }
.day .stamp { display: grid; place-items: center; width: 34px; height: 34px; margin: 0 auto 2px; border-radius: 50%; border: 2px solid var(--red); color: var(--red); font-family: var(--f-display); font-size: 18px; }
.day .d { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.pic { width: 64px; height: 64px; display: grid; place-items: center; font-size: 40px; line-height: 1; }
.pic img { width: 64px; height: 64px; object-fit: contain; }
.name { min-width: 0; }
.name b { display: block; font-size: 18px; font-weight: 700; overflow-wrap: anywhere; line-height: 1.3; }
.name .price { font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.name .empty { color: var(--ink-2); font-weight: 400; }
.ico { width: 40px; height: 40px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); display: grid; place-items: center; color: var(--ink-2); }
.ico svg { width: 20px; height: 20px; }
.ico[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.row.locked .name b::after { content: '已鎖定'; margin-left: 8px; font-size: 11px; font-weight: 700; color: var(--red); border: 1.5px solid var(--red); border-radius: 6px; padding: 0 5px; vertical-align: 2px; }
.row.spin .pic, .row.spin .name b { filter: blur(.4px); }
.row.land .pic, .today.land .pic { animation: land .35s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes land { 0% { transform: scale(.7); } 100% { transform: scale(1); } }
.slip-foot { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; border-top: 2px solid var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.slip-foot .sum { font-size: 20px; color: var(--red); }

/* 今天 */
.today { display: grid; justify-items: center; text-align: center; gap: 4px; padding: 22px 18px 18px; }
.today .pic { width: 150px; height: 150px; font-size: 96px; }
.today .pic img { width: 150px; height: 150px; }
.today b { font-family: var(--f-display); font-weight: 400; font-size: 34px; line-height: 1.2; overflow-wrap: anywhere; }
.today .price { font-size: 16px; color: var(--ink-2); }
.today .again { margin-top: 10px; border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 18px; font-weight: 500; }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { border: 2px solid var(--ink); background: var(--card); color: var(--ink); border-radius: 14px; padding: 12px 10px; font-weight: 700; font-size: 16px; display: inline-flex; gap: 8px; align-items: center; justify-content: center; }
.btn.primary { background: var(--ink); color: var(--paper); }
.btn svg { width: 20px; height: 20px; flex: none; }

/* 菜單板 */
.menu { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.menu h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 24px; display: flex; align-items: baseline; gap: 10px; }
.menu h2 span { font-family: var(--f-body); font-size: 14px; color: var(--ink-2); }
.hint { margin: -6px 0 0; font-size: 14px; color: var(--ink-2); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px; padding: 4px 6px 4px 4px; max-width: 100%; }
.chip > button.t { border: 0; background: none; display: inline-flex; align-items: center; gap: 6px; padding: 0; min-width: 0; text-align: left; }
.chip .cp { width: 30px; height: 30px; display: grid; place-items: center; font-size: 20px; flex: none; }
.chip .cp img { width: 30px; height: 30px; object-fit: contain; }
.chip .nm { font-size: 15px; font-weight: 500; overflow-wrap: anywhere; }
.chip .pr { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.chip .x { border: 0; background: none; width: 26px; height: 26px; border-radius: 50%; color: var(--ink-2); display: grid; place-items: center; flex: none; }
.chip .x:hover { background: var(--red-soft); color: var(--red); }
.chip .x svg { width: 14px; height: 14px; }
.chip.off { opacity: .4; }
.chip.off .nm { text-decoration: line-through; }
.add { display: grid; grid-template-columns: minmax(0, 1fr) 96px auto; gap: 8px; }
.add input { border: 1.5px solid var(--line); background: var(--paper); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.add button { border: 0; background: var(--ink); color: var(--paper); border-radius: 12px; padding: 0 16px; font-weight: 700; }
details summary { cursor: pointer; font-weight: 500; color: var(--ink-2); font-size: 15px; }
details[open] summary { margin-bottom: 10px; }
.lib .chip { padding-right: 12px; }
.link { border: 0; background: none; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; align-self: flex-start; padding: 2px 0; font-size: 14px; }
.share-note { font-size: 13px; color: var(--ink-2); text-align: center; margin: 0; }

/* 預覽與提示 */
.modal { position: fixed; inset: 0; background: rgba(20, 16, 12, .6); display: grid; place-items: center; z-index: 50;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal-box { background: var(--card); border-radius: 18px; padding: 16px; max-width: 420px; width: 100%; max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.modal-box img { width: 100%; border-radius: 10px; border: 1px solid var(--line); }
.modal-box p { margin: 0; font-size: 15px; }
.modal-box textarea { width: 100%; min-height: 180px; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px; background: var(--paper); color: var(--ink); font: inherit; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px; font-weight: 500; z-index: 60; max-width: calc(100% - 32px); text-align: center; }

@media (max-width: 420px) {
  .row { grid-template-columns: 40px 52px minmax(0, 1fr) auto auto; gap: 8px; padding: 10px; }
  .pic, .pic img { width: 52px; height: 52px; font-size: 34px; }
  .ico { width: 36px; height: 36px; }
  .name b { font-size: 16px; }
  .seg.big button { padding: 9px 20px; }
}
@media (prefers-reduced-motion: reduce) {
  .cube { transition: none; }
  .row.land .pic, .today.land .pic { animation: none; }
}
</style>

<div class="wrap">
  <header class="sign">
    <div>
      <h1>早餐骰子</h1>
      <p>想不到吃什麼就骰一下，可以只骰今天，也能一次排好一整週。</p>
    </div>
    <button class="dice-btn" id="diceBtn" aria-label="擲骰子">
      <div class="cube" id="cube"></div>
    </button>
  </header>

  <section class="controls">
    <div class="seg big" role="group" aria-label="骰的範圍">
      <button id="modeToday" aria-pressed="false">今天</button>
      <button id="modeWeek" aria-pressed="true">一整週</button>
    </div>
    <div class="opts" id="weekOpts">
      <div class="seg" role="group" aria-label="哪一週">
        <button id="wkThis" aria-pressed="true">本週</button>
        <button id="wkNext" aria-pressed="false">下週</button>
      </div>
      <div class="seg" role="group" aria-label="天數">
        <button id="d5" aria-pressed="true">週一～五</button>
        <button id="d7" aria-pressed="false">週一～日</button>
      </div>
      <label class="chk"><input type="checkbox" id="noRepeat" checked> 同一週不重複</label>
    </div>
  </section>

  <button class="roll-main" id="rollBtn">擲骰子<small id="rollSub">鎖定的那天不會變</small></button>

  <section class="slip" id="slip" aria-live="polite"></section>

  <div class="actions">
    <button class="btn primary" id="copyImg">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>
      複製圖片
    </button>
    <button class="btn" id="copyTxt">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>
      複製文字
    </button>
  </div>
  <p class="share-note">複製後直接到 LINE 群組貼上。菜單和結果只存在你自己的手機裡。</p>

  <section class="menu">
    <h2>菜單<span id="menuCount"></span></h2>
    <p class="hint">點品項可以暫時不骰它（變淡），再點一下恢復。按 × 刪除。</p>
    <div class="chips" id="chips"></div>
    <form class="add" id="addForm" autocomplete="off">
      <input id="addName" placeholder="品名，例如：起司蛋餅" maxlength="20" aria-label="品名">
      <input id="addPrice" type="number" inputmode="numeric" min="0" max="999" placeholder="價錢" aria-label="價錢">
      <button type="submit">加入</button>
    </form>
    <details>
      <summary>從圖庫快速加入</summary>
      <div class="chips lib" id="libChips"></div>
    </details>
    <div id="resetWrap"><button class="link" id="resetMenu" type="button">恢復預設菜單</button></div>
  </section>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <p id="modalTitle"><b id="modalHead"></b></p>
    <div id="modalBody"></div>
    <button class="btn" id="closeModal">關閉</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

/* ---------- 狀態 ---------- */
let S = load() || {
  mode: 'week', next: new Date().getDay() % 6 === 0, days: 5, noRepeat: true,
  menu: DEFAULT_MENU.map(m => ({ ...m, off: false })),

// 早餐帳之後新增的品項、新畫好的圖，老使用者也收得到（自己刪掉的不會再塞回來）
(function syncDefaults() {
  const known = new Set(S.known || S.menu.map(m => m.name));
  DEFAULT_MENU.forEach(d => {
    const m = S.menu.find(x => x.name === d.name);
    if (m && !m.pic && d.pic) { m.pic = d.pic; delete m.emoji; }
    if (!m && !known.has(d.name)) S.menu.push({ ...d, off: false });
    known.add(d.name);
  });
  S.menu.forEach(m => { if (!m.pic) { const k = guessPic(m.name); if (k) m.pic = k; } });
  S.known = [...known];
})();
function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }

/* ---------- 日期 ---------- */
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const md = d => `${d.getMonth() + 1}/${d.getDate()}`;
function weekDates() {
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const mon = new Date(t); mon.setDate(t.getDate() - ((t.getDay() + 6) % 7) + (S.next ? 7 : 0));
  return Array.from({ length: S.days }, (_, i) => { const d = new Date(mon); d.setDate(mon.getDate() + i); return d; });
}
const planKey = () => iso(weekDates()[0]) + '/' + S.days;

/* ---------- 隨機 ---------- */
function rnd(n) { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
const pool = () => S.menu.filter(m => !m.off);
const snap = m => ({ name: m.name, price: m.price, pic: m.pic || null, emoji: m.emoji || null });
function pickFor(slots, locks, i) {
  const all = pool();
  const used = new Set(slots.filter((s, j) => s && j !== i && (locks[j] || j < i)).map(s => s.name));
  const near = new Set([slots[i - 1], slots[i + 1]].filter(Boolean).map(s => s.name));
  let opts = all.filter(m => !(S.noRepeat && used.has(m.name)) && !near.has(m.name));
  if (!opts.length) opts = all.filter(m => !near.has(m.name));
  if (!opts.length) opts = all;
  return snap(opts[rnd(opts.length)]);
}
function ensurePlan() {
  if (!S.plan || S.plan.key !== planKey()) S.plan = { key: planKey(), slots: Array(S.days).fill(null), locks: Array(S.days).fill(false) };
}

function render() {
  const week = S.mode === 'week';
  $('modeToday').setAttribute('aria-pressed', !week); $('modeWeek').setAttribute('aria-pressed', week);
  $('wkThis').setAttribute('aria-pressed', !S.next); $('wkNext').setAttribute('aria-pressed', S.next);
  $('d5').setAttribute('aria-pressed', S.days === 5); $('d7').setAttribute('aria-pressed', S.days === 7);
  $('noRepeat').checked = S.noRepeat;
  $('weekOpts').hidden = !week;
  $('rollSub').textContent = week ? '鎖定的那天不會變' : '只骰今天這一餐';
  week ? renderWeek() : renderToday();
  renderMenu();
}
function renderWeek() {
  ensurePlan();
  const ds = weekDates(), today = iso(new Date());
  const { slots, locks } = S.plan;
  const sum = slots.reduce((a, s) => a + (s ? +s.price || 0 : 0), 0);
  $('slip').innerHTML = `
    <div class="slip-head"><b>${S.next ? '下週' : '本週'}早餐</b><span>${md(ds[0])}（${WD[ds[0].getDay()]}）～ ${md(ds[ds.length - 1])}（${WD[ds[ds.length - 1].getDay()]}）</span></div>
    <ol class="rows">${ds.map((d, i) => {
      const s = slots[i];
      return `<li class="row${locks[i] ? ' locked' : ''}${iso(d) === today ? ' is-today' : ''}" data-i="${i}">
        <div class="day"><span class="stamp">${WD[d.getDay()]}</span><span class="d">${md(d)}</span></div>
        <div class="pic">${picHTML(s)}</div>
        <div class="name">${s ? `<b>${esc(s.name)}</b><span class="price">$${s.price || 0}</span>` : '<b class="empty">還沒骰</b>'}</div>
        <button class="ico" data-act="lock" aria-pressed="${locks[i]}" aria-label="鎖定${WD[d.getDay()]}" title="鎖定這天">${ICON_LOCK}</button>
        <button class="ico" data-act="re" aria-label="只重骰${WD[d.getDay()]}" title="只重骰這天">${ICON_RE}</button>
      </li>`;
    }).join('')}</ol>
    <div class="slip-foot"><span>${S.days} 天合計</span><span class="sum">$${sum}</span></div>`;
}
function renderToday() {
  const d = new Date(), t = S.today && S.today.date === iso(d) ? S.today.item : null;
  $('slip').innerHTML = `
    <div class="slip-head"><b>今天早餐</b><span>${md(d)}（${WD[d.getDay()]}）</span></div>
    <div class="today">
      <div class="pic">${t ? picHTML(t) : '🎲'}</div>
      <b>${t ? esc(t.name) : '按上面的骰子'}</b>
      <span class="price">${t ? '$' + (t.price || 0) : '骰一下就知道今天吃什麼'}</span>
    </div>`;
}
function renderMenu() {
  const on = pool().length;
  $('menuCount').textContent = `${S.menu.length} 樣，這次參加 ${on} 樣`;
  $('chips').innerHTML = S.menu.map((m, i) => `
    <span class="chip${m.off ? ' off' : ''}">
      <button class="t" type="button" data-tog="${i}" aria-pressed="${!m.off}"><span class="cp">${picHTML(m)}</span><span class="nm">${esc(m.name)}</span><span class="pr">$${m.price || 0}</span></button>
      <button class="x" type="button" data-del="${i}" aria-label="刪除${esc(m.name)}">${ICON_X}</button>
    </span>`).join('');
  const have = new Set(S.menu.map(m => m.pic).filter(Boolean));
  const rest = LIB.filter(e => !have.has(e.key));
  $('libChips').innerHTML = rest.length ? rest.map(e => `
    <span class="chip"><button class="t" type="button" data-lib="${e.key}"><span class="cp"><img src="${PICS[e.key]}" alt=""></span><span class="nm">${esc(e.name)}</span></button></span>`).join('')
    : '<span class="hint">圖庫的品項都已經在菜單裡了。</span>';
}

/* ---------- 擲 ---------- */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let rolling = false;
function roll(only) {
  if (rolling) return;
  if (!pool().length) return toast('菜單裡沒有可以骰的品項，先在下面加一些。');
  tumble();
  if (S.mode === 'today') {
    S.today = { date: iso(new Date()), item: pickFor([S.today && S.today.item], [true], 1) };
    save();
    return spin([0], () => renderToday());
  }
  ensurePlan();
  const { slots, locks } = S.plan;
  const idx = only != null ? [only] : slots.map((_, i) => i).filter(i => !locks[i]);
  if (!idx.length) return toast('每一天都鎖定了，先解鎖想換的那天。');
  if (only != null && locks[only]) locks[only] = false;
  idx.forEach(i => { slots[i] = null; });
  idx.forEach(i => { slots[i] = pickFor(slots, locks.map((l, j) => l || !idx.includes(j)), i); });
  save();
  spin(idx, renderWeek);
}
function spin(idx, done) {
  render(); // 先畫出結構
  if (reduce) return land(idx);
  rolling = true;
  const all = pool();
  const rows = S.mode === 'today' ? [$('slip').querySelector('.today')] : idx.map(i => $('slip').querySelector(`.row[data-i="${i}"]`));
  rows.forEach(r => r.classList.add('spin'));
  const timer = setInterval(() => rows.forEach(r => {
    if (!r.classList.contains('spin')) return;
    const m = all[rnd(all.length)];
    r.querySelector('.pic').innerHTML = picHTML(m);
    r.querySelector('b').textContent = m.name;
  }), 70);
  // 先蓋掉真正的結果，再逐格停
  rows.forEach(r => { const m = all[rnd(all.length)]; r.querySelector('.pic').innerHTML = picHTML(m); r.querySelector('b').textContent = m.name; });
  rows.forEach((r, k) => setTimeout(() => {
    r.classList.remove('spin');
    if (k === rows.length - 1) { clearInterval(timer); rolling = false; done(); land(idx); }
    else stopRow(r, idx[k]);
  }, 650 + k * 170));
}
function stopRow(r, i) {
  const s = S.plan.slots[i];
  r.querySelector('.pic').innerHTML = picHTML(s);
  r.querySelector('b').textContent = s.name;
  r.classList.add('land');
}
function land(idx) {
  if (S.mode === 'today') { const t = $('slip').querySelector('.today'); if (t) t.classList.add('land'); return; }
  idx.forEach(i => { const r = $('slip').querySelector(`.row[data-i="${i}"]`); if (r) r.classList.add('land'); });
}

/* ---------- 複製 ---------- */
const imgCache = {};
function imgOf(key) {
  if (!imgCache[key]) { const im = new Image(); im.src = PICS[key]; imgCache[key] = im; }
  return imgCache[key];
}
function listForCopy() {
  if (S.mode === 'today') {
    const d = new Date(), t = S.today && S.today.date === iso(d) ? S.today.item : null;
    return t ? { title: '今天早餐', sub: `${md(d)}（${WD[d.getDay()]}）`, rows: [{ day: WD[d.getDay()], date: md(d), item: t }] } : null;
  }
  ensurePlan();
  const ds = weekDates();
  if (S.plan.slots.every(s => !s)) return null;
  return {
    title: (S.next ? '下週' : '本週') + '早餐',
    sub: `${md(ds[0])}（${WD[ds[0].getDay()]}）～ ${md(ds[ds.length - 1])}（${WD[ds[ds.length - 1].getDay()]}）`,
    rows: ds.map((d, i) => ({ day: WD[d.getDay()], date: md(d), item: S.plan.slots[i] })),
  };
}
async function drawCanvas(L) {
  try { await Promise.all([document.fonts.load('40px Huninn'), document.fonts.load('700 28px "Noto Sans TC"')]); } catch {}
  await Promise.all(L.rows.map(r => r.item && r.item.pic && PICS[r.item.pic] ? imgOf(r.item.pic).decode().catch(() => {}) : null));
  const K = 2, W = 640, HEAD = 112, RH = 92, FOOT = 92;
  const H = HEAD + RH * L.rows.length + FOOT;
  const c = document.createElement('canvas'); c.width = W * K; c.height = H * K;
  const g = c.getContext('2d'); g.scale(K, K);
  const DISP = 'Huninn, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif';
  const BODY = '"Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif';
  g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#F4B400'; g.fillRect(0, 0, W, HEAD);
  g.fillStyle = '#1F1C18'; g.textBaseline = 'alphabetic';
  g.font = `44px ${DISP}`; g.fillText(L.title, 32, 62);
  g.font = `500 20px ${BODY}`; g.fillText(L.sub, 32, 94);
  // 小骰子
  g.save(); g.translate(W - 88, 26); g.fillStyle = '#FFFFFF'; g.strokeStyle = '#1F1C18'; g.lineWidth = 3;
  rr(g, 0, 0, 58, 58, 12); g.fill(); g.stroke();
  [[14, 14], [29, 29], [44, 44]].forEach(([x, y], k) => { g.beginPath(); g.fillStyle = k === 1 ? '#CF2F1B' : '#1F1C18'; g.arc(x, y, k === 1 ? 7 : 5.5, 0, 7); g.fill(); });
  g.restore();
  let sum = 0;
  L.rows.forEach((r, i) => {
    const y = HEAD + i * RH;
    if (i > 0) { g.strokeStyle = '#E3DDD0'; g.lineWidth = 2; g.setLineDash([7, 6]); g.beginPath(); g.moveTo(24, y); g.lineTo(W - 24, y); g.stroke(); g.setLineDash([]); }
    g.strokeStyle = '#CF2F1B'; g.lineWidth = 2.5; g.beginPath(); g.arc(56, y + 38, 20, 0, 7); g.stroke();
    g.fillStyle = '#CF2F1B'; g.font = `22px ${DISP}`; g.textAlign = 'center'; g.fillText(r.day, 56, y + 46);
    g.fillStyle = '#3D3832'; g.font = `500 14px ${BODY}`; g.fillText(r.date, 56, y + 80); g.textAlign = 'left';
    const it = r.item, px = 98;
    if (it && it.pic && PICS[it.pic]) g.drawImage(imgOf(it.pic), px, y + 10, 72, 72);
    else if (it) { g.font = `48px ${BODY}`; g.textAlign = 'center'; g.fillText(it.emoji || '🍳', px + 36, y + 64); g.textAlign = 'left'; }
    const nx = 190, maxW = W - nx - 120;
    g.fillStyle = '#1F1C18';
    let fs = 28; g.font = `700 ${fs}px ${BODY}`;
    const nm = it ? it.name : '（還沒骰）';
    while (g.measureText(nm).width > maxW && fs > 16) { fs -= 1; g.font = `700 ${fs}px ${BODY}`; }
    g.fillText(nm, nx, y + 56);
    if (it) {
      sum += +it.price || 0;
      g.font = `700 24px ${BODY}`; g.textAlign = 'right'; g.fillStyle = '#3D3832'; g.fillText('$' + (it.price || 0), W - 32, y + 56); g.textAlign = 'left';
    }
  });
  const fy = HEAD + RH * L.rows.length;
  g.fillStyle = '#1F1C18'; g.fillRect(24, fy + 6, W - 48, 3);
  g.font = `700 22px ${BODY}`; g.fillText(L.rows.length > 1 ? `${L.rows.length} 天合計` : '合計', 32, fy + 50);
  g.fillStyle = '#CF2F1B'; g.font = `700 30px ${BODY}`; g.textAlign = 'right'; g.fillText('$' + sum, W - 32, fy + 52);
  g.fillStyle = '#7A7268'; g.font = `400 14px ${BODY}`; g.fillText('早餐骰子擲出來的，不服來骰', W - 32, fy + 80); g.textAlign = 'left';
  return c;
}
function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

$('copyImg').onclick = () => {
  const L = listForCopy();
  if (!L) return toast('先擲一次骰子，才有清單可以複製。');
  const blobP = drawCanvas(L).then(c => new Promise(res => c.toBlob(res, 'image/png')));
  let ok = false;
  try {
    if (navigator.clipboard && window.ClipboardItem) {
      navigator.clipboard.write([new ClipboardItem({ 'image/png': blobP })])
        .then(() => toast('圖片已複製，到 LINE 貼上就好'))
        .catch(() => showImg(blobP));
      ok = true;
    }
  } catch {}
  if (!ok) showImg(blobP);
};
async function showImg(blobP) {
  const url = URL.createObjectURL(await blobP);
  openModal('這個瀏覽器不能直接複製圖片', `<img src="${url}" alt="早餐清單圖片"><p>手機：長按圖片，選「拷貝」或「儲存圖片」。<br>電腦：在圖片上按右鍵，選「複製圖片」。</p>`);
}
function textForCopy() {
  const L = listForCopy(); if (!L) return null;
  let sum = 0;
  const lines = L.rows.map(r => { if (r.item) sum += +r.item.price || 0; return `${r.day} ${r.date}　${r.item ? `${r.item.name}　$${r.item.price || 0}` : '（還沒骰）'}`; });
  return `🎲 ${L.title}　${L.sub}\n${lines.join('\n')}\n合計 $${sum}`;
}
$('copyTxt').onclick = () => {
  const t = textForCopy();
  if (!t) return toast('先擲一次骰子，才有清單可以複製。');
  const fail = () => openModal('請手動複製', `<textarea id="copyArea" readonly>${esc(t)}</textarea><p>全選後複製（手機長按文字）。</p>`, () => { const a = $('copyArea'); a.focus(); a.select(); });
  try { navigator.clipboard.writeText(t).then(() => toast('文字已複製'), fail); } catch { fail(); }
};

/* ---------- 對話框與提示 ---------- */
function openModal(head, body, after) { $('modalHead').textContent = head; $('modalBody').innerHTML = body; $('modal').hidden = false; after && after(); $('closeModal').focus(); }
$('closeModal').onclick = () => { $('modal').hidden = true; };
$('modal').onclick = e => { if (e.target === $('modal')) $('modal').hidden = true; };
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('modal').hidden = true; });
let tt;
function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(tt); tt = setTimeout(() => { el.hidden = true; }, 2400); }

/* ---------- 事件 ---------- */
$('rollBtn').onclick = () => roll();
$('diceBtn').onclick = () => roll();
$('modeToday').onclick = () => { S.mode = 'today'; save(); render(); };
$('modeWeek').onclick = () => { S.mode = 'week'; save(); render(); };
$('wkThis').onclick = () => { S.next = false; save(); render(); };
$('wkNext').onclick = () => { S.next = true; save(); render(); };
$('d5').onclick = () => { S.days = 5; save(); render(); };
$('d7').onclick = () => { S.days = 7; save(); render(); };
$('noRepeat').onchange = e => { S.noRepeat = e.target.checked; save(); };
$('slip').onclick = e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const i = +b.closest('.row').dataset.i;
  if (b.dataset.act === 'lock') {
    if (!S.plan.slots[i]) return toast('這天還沒骰，不能鎖。');
    S.plan.locks[i] = !S.plan.locks[i]; save(); renderWeek();
  } else roll(i);
};
$('chips').onclick = e => {
  const t = e.target.closest('[data-tog]'), x = e.target.closest('[data-del]');
  if (t) { const m = S.menu[+t.dataset.tog]; m.off = !m.off; save(); renderMenu(); }
  if (x) { const m = S.menu.splice(+x.dataset.del, 1)[0]; save(); renderMenu(); toast(`已刪除「${m.name}」`); }
};
$('libChips').onclick = e => {
  const b = e.target.closest('[data-lib]'); if (!b) return;
  const e2 = LIB.find(l => l.key === b.dataset.lib);
  S.menu.push({ name: e2.name, price: 0, pic: e2.key, off: false }); save(); renderMenu();
  toast(`已加入「${e2.name}」，價錢先記 $0`);
};
// 跟早餐帳 guessPic 同一套：括號內不算，品名含圖庫主名就中，挑最長的
function guessPic(name) {
  const bare = s => String(s).replace(/[（(].*?[)）]/g, '').trim(), n = bare(name);
  const hit = LIB.filter(l => bare(l.name) && n.includes(bare(l.name)))
    .sort((a, b) => bare(b.name).length - bare(a.name).length || a.name.length - b.name.length)[0];
  return hit ? hit.key : null;
}
$('addForm').onsubmit = e => {
  e.preventDefault();
  const name = $('addName').value.trim(); if (!name) return $('addName').focus();
  if (S.menu.some(m => m.name === name)) return toast('菜單裡已經有這一樣了');
  const price = Math.max(0, Math.min(999, parseInt($('addPrice').value, 10) || 0));
  S.menu.push({ name, price, pic: guessPic(name), off: false });
  $('addName').value = ''; $('addPrice').value = '';
  save(); renderMenu(); toast(`已加入「${name}」`);
};
function askReset() {
  const w = $('resetWrap');
  w.innerHTML = `<span class="hint">確定要換回預設的 ${DEFAULT_MENU.length} 樣？你加的品項會清掉。</span> <button class="link" id="resetYes" type="button">確定</button> <button class="link" id="resetNo" type="button">取消</button>`;
  $('resetYes').onclick = () => { S.menu = DEFAULT_MENU.map(m => ({ ...m, off: false })); S.known = DEFAULT_MENU.map(m => m.name); save(); restoreReset(); renderMenu(); toast('已恢復預設菜單'); };
  $('resetNo').onclick = restoreReset;
}
function restoreReset() { $('resetWrap').innerHTML = '<button class="link" id="resetMenu" type="button">恢復預設菜單</button>'; $('resetMenu').onclick = askReset; }
$('resetMenu').onclick = askReset;

/* ---------- 開場：第一次進來先幫忙骰好一份，畫面不會空著 ---------- */
ensurePlan();
if (S.plan.slots.every(s => !s) && pool().length) {
  S.plan.slots.forEach((_, i) => { S.plan.slots[i] = pickFor(S.plan.slots, S.plan.locks, i); });
  save();
}
render();
</script>
